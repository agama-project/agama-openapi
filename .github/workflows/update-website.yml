name: Update Website Documentation

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'nightly/**'
      - '[0-9]*/**'
      - '.github/workflows/update-website.yml'

  workflow_dispatch:

jobs:
  sync-to-website:
    # Do not run in forks
    if: ${{ !github.event.repository.fork }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenAPI sources
        uses: actions/checkout@v7
        with:
          path: agama-openapi

      - name: Checkout Website sources
        uses: actions/checkout@v7
        with:
          path: website
          repository: ${{ github.repository_owner }}/agama-project.github.io
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git user and email
        run: |
          git config --global user.name "YaST Bot"
          git config --global user.email "yast-devel@opensuse.org"

      - name: Sync OpenAPI specifications to website
        run: |
          mkdir -p website/static/openapi

          # Sync nightly specifications and standalone schemas
          if [ -d "agama-openapi/nightly" ]; then
            mkdir -p website/static/openapi/nightly
            cp -a agama-openapi/nightly/* website/static/openapi/nightly/
          fi

          # Sync versioned release specifications (e.g., 16.1) and ensure doc page exists
          for dir in agama-openapi/[0-9]*; do
            if [ -d "$dir" ]; then
              version=$(basename "$dir")
              mkdir -p "website/static/openapi/$version"
              cp -a "$dir"/* "website/static/openapi/$version/"

              doc_page="website/docs/user/reference/openapi/${version}.mdx"
              if [ ! -f "$doc_page" ]; then
                echo "Generating doc page for version $version..."
                cat <<EOF > "$doc_page"
---
title: ${version}
sidebar_position: 10
hide_table_of_contents: true
---

import SwaggerViewer from '@site/src/components/SwaggerViewer';

# Version ${version} HTTP API Reference

Interactive OpenAPI documentation for the Agama installer (${version} release).

:::info
Downloads: [openapi.json](/openapi/${version}/openapi.json) | [openapi.yaml](/openapi/${version}/openapi.yaml)
:::

<SwaggerViewer specUrl="/openapi/${version}/openapi.json" />
EOF
              fi
            fi
          done

      - name: Check for changes in website repository
        id: check_changes
        run: |
          cd website
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes in OpenAPI specifications."
          fi

      - name: Commit and push changes to website
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          cd website
          git add static/openapi docs/user/reference/openapi
          git commit -m "Update OpenAPI specifications from agama-openapi"$'\n\n'"agama-openapi commit: ${{ github.sha }}"
          git push
